<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:#08090b; display:flex; gap:40px; align-items:center; justify-content:center; height:100vh; font-family:sans-serif; flex-wrap:wrap; }
  .box { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .box span { color:#8b8d97; font-size:12px; }
  .swatch { background:#0e1012; border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:14px; }
</style>
</head>
<body>

<div class="box">
<div class="swatch">
<svg width="260" height="260" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- pipes -->
  <path d="M22 96 h20 v-14 h30" stroke="rgba(255,255,255,.25)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M98 96 h-14 v-20 h-10" stroke="rgba(255,255,255,.25)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="42" cy="82" r="2.6" fill="rgba(255,255,255,.35)"/>
  <circle cx="84" cy="76" r="2.6" fill="rgba(255,255,255,.35)"/>

  <!-- left tank -->
  <rect x="10" y="70" width="26" height="30" rx="6" fill="#7fc2ff"/>
  <rect x="10" y="70" width="26" height="8" rx="4" fill="#a9d6ff"/>
  <rect x="14" y="86" width="18" height="4" rx="2" fill="#5fa8e6"/>

  <!-- right tank -->
  <rect x="84" y="76" width="24" height="24" rx="6" fill="#6fdba8"/>
  <rect x="84" y="76" width="24" height="7" rx="3.5" fill="#9aeecb"/>
  <rect x="88" y="90" width="16" height="4" rx="2" fill="#4dbf8c"/>

  <!-- main tower -->
  <rect x="46" y="30" width="24" height="70" rx="7" fill="#5e6ad2"/>
  <rect x="46" y="30" width="9" height="70" rx="4" fill="#7c86e6"/>
  <rect x="46" y="48" width="24" height="5" rx="2" fill="#454fb0"/>
  <rect x="46" y="64" width="24" height="5" rx="2" fill="#454fb0"/>
  <rect x="46" y="80" width="24" height="5" rx="2" fill="#454fb0"/>
  <ellipse cx="58" cy="30" rx="12" ry="6" fill="#6c77dc"/>

  <!-- flare stack -->
  <rect x="74" y="46" width="7" height="54" rx="3.5" fill="#3a4152"/>
  <rect x="74" y="46" width="3" height="54" rx="1.5" fill="#4d5568"/>

  <!-- flame -->
  <path d="M77.5 46 C73 40 74 33 78 28 C77 34 80 35 82 31 C83 37 88 39 84 46 C82 43 80 44 79 47 C78.5 46.6 78 46.3 77.5 46 Z" fill="#e2a33d"/>
  <path d="M77.5 44 C75 40 76 36 78.5 33 C78 37 80 37.5 81 35.5 C82 39 84 40 82 44 C80.5 42 79.5 42.5 79 44.5 C78.5 44.3 78 44.1 77.5 44 Z" fill="#f2c46b"/>

  <!-- smoke -->
  <circle cx="58" cy="20" r="5" fill="rgba(255,255,255,.18)"/>
  <circle cx="52" cy="13" r="6.5" fill="rgba(255,255,255,.14)"/>
  <circle cx="63" cy="8" r="5.5" fill="rgba(255,255,255,.10)"/>

  <!-- ground shadow -->
  <ellipse cx="60" cy="103" rx="52" ry="4" fill="rgba(255,255,255,.04)"/>
</svg>
</div>
<span>detailed — 260px</span>
</div>
